<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta
      name="description"
      content="beeChess — онлайн-школа индивидуального обучения шахматам для детей и взрослых"
    />
    <title>beeChess — Online Chess Academy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f1f5f9;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        background: #f1f5f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 9999;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease;
      }

      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loader-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 32px;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.02em;
      }

      .app-loader-logo .emoji {
        font-size: 40px;
        line-height: 1;
      }

      .app-loader-logo .accent {
        color: #f59e0b;
      }

      .app-loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: bee-spin 0.8s linear infinite;
      }

      @keyframes bee-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="app-loader-logo">
        <span class="emoji">🐝</span>
        <span>bee<span class="accent">chess</span></span>
      </div>
      <div class="app-loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
